[package]
name = "app"
version = "2.0.1"
description = "BejaClient — A Better Minecraft Launcher (Tauri + Rust edition)"
authors = ["Beja"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks", "multipart"] }
futures-util = "0.3"

# Auth / crypto
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Networking / MC protocol
byteorder = "1.5"
url = "2"
flate2 = "1"
hickory-resolver = "0.24"

# Archives (forge/fabric installers, mod packs, native jar extraction)
zip = "2"
async_zip = { version = "0.0.17", features = ["full"] }

# Realtime (Beja friends/lobby socket)
rust_socketio = { version = "0.6", features = ["async"] }

# Discord Rich Presence
discord-rich-presence = "0.2"

# Logging / misc
log = "0.4"
thiserror = "1"
anyhow = "1"
dirs = "5"
regex = "1"
urlencoding = "2"
once_cell = "1"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
junction = "1"
